<div class="login-wrapper">
  <!-- Animated Background Shapes -->
  <div class="bg-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>
  <div class="grid-overlay"></div>

  <!-- Signup Card -->
  <div class="login-card">
    <div class="glow-ring"></div>

    <!-- Brand -->
    <div class="brand">
      <div class="logo-symbol">
        <svg width="48" height="48" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#0a1628" stroke="#C9A84C" stroke-width="1.5"/>
          <path d="M12 26L20 12L28 26H12Z" fill="white" opacity="0.95"/>
          <path d="M16 22L20 16L24 22H16Z" fill="#C9A84C"/>
          <circle cx="20" cy="28" r="2" fill="#C9A84C" opacity="0.6"/>
          <path d="M10 28L30 28" stroke="#C9A84C" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
        </svg>
      </div>
      <h1>Freight<span>Pulse</span></h1>
      <p>Start Your Global Journey</p>
    </div>

    <!-- Signup Form -->
    <form (ngSubmit)="onSignup()">
      <div class="input-group">
        <label>👤 Username</label>
        <input type="text" [(ngModel)]="signupUsername" name="signupUsername" placeholder="Choose a unique ID" required [disabled]="isLoading">
        <div class="input-glow"></div>
      </div>

      <div class="input-group password-group">
        <label>🔒 Password</label>
        <div class="password-wrapper">
          <input [type]="showSignupPassword ? 'text' : 'password'" [(ngModel)]="signupPassword" name="signupPassword" placeholder="Min 4 characters" required [disabled]="isLoading">
          <span class="eye-icon" (click)="showSignupPassword = !showSignupPassword">
            {{ showSignupPassword ? '🙈' : '👁️' }}
          </span>
        </div>
      </div>

      <div class="input-group password-group">
        <label>✅ Confirm Password</label>
        <div class="password-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Re-enter to verify" required [disabled]="isLoading">
          <span class="eye-icon" (click)="showConfirmPassword = !showConfirmPassword">
            {{ showConfirmPassword ? '🙈' : '👁️' }}
          </span>
        </div>
        <div *ngIf="confirmPassword && signupPassword && confirmPassword !== signupPassword" class="error-msg">
          ⚠️ Passwords do not match!
        </div>
      </div>

      <button type="submit" class="btn-gold" [disabled]="isLoading || confirmPassword !== signupPassword || !signupUsername || !signupPassword">
        <span *ngIf="!isLoading">🚀 Launch Account</span>
        <span *ngIf="isLoading" class="spinner-container"><span class="spinner"></span> Creating...</span>
      </button>
    </form>

    <!-- Link to Login -->
    <p class="toggle-link">
      <span>Already have an account?</span>
      <a routerLink="/login">Log in here</a>
    </p>
  </div>
</div>
